# Monthly dependency updates, one grouped PR per ecosystem; CI tests each PR and
# dependabot-automerge.yml merges it when CI passes (major versions wait for a human).
# The PC picks merged updates up via scripts/update.sh (weekly "update" task).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
