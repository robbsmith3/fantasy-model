name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, secrets, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked
      - name: Lint, format, secret scan
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web (types, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev
