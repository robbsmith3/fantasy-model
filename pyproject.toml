[project]
name = "fantasy-model"
version = "0.1.0"
description = "Guillotine-league FAAB / survival model"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "nflreadpy>=0.1",
    "polars>=1.0",
    "pandas",
    "requests",
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "kfp",
    "pytz>=2026.6",
]

[project.scripts]
ffm = "fantasy_model.cli:main"

[dependency-groups]
dev = ["ruff", "pytest", "pre-commit", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
