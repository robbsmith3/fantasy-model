[project]
name = "fantasy-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robb", email = "robbsmith08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kfp>=2.18.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "requests>=2.33.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
fantasy-model = "fantasy_model:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
